<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>V0.4.0 开场时序检查</title>
  <style>
    .boot-review-controls{position:fixed;right:16px;bottom:16px;z-index:2000;width:min(480px,calc(100vw - 32px));box-sizing:border-box;padding:14px;background:#faf9f2ed;border:1px solid #c5c6bd;color:#222;font:12px/1.6 system-ui,sans-serif}
    .boot-review-controls strong,.boot-review-controls output{display:block;margin-bottom:8px}
    .boot-review-controls button{padding:7px 9px;margin:2px;border:1px solid #abb0a9;background:#fff;cursor:pointer;color:#222}
    .boot-review-controls button[aria-pressed=true]{background:#26312b;color:#fff}
    .boot-review-controls label{display:inline-flex;gap:6px;margin:8px 10px 0 0}
  </style>
</head>
<body>
  <main id="stage" class="music-app" data-mode="archive" data-theme="day"></main>
  <aside class="boot-review-controls" aria-label="启动画面检查控制">
    <strong>V0.4.0 开场 · 固定节点 · 无声音 / 无三维渲染</strong>
    <div>
      <button data-time="1.45">品牌</button><button data-time="2.35">圆环</button>
      <button data-time="4.4">标语</button><button data-time="6.1">衔接</button>
      <button id="play">完整播放</button>
    </div>
    <label>主题<select id="theme"><option value="day">暖昼</option><option value="night">深夜</option></select></label>
    <label>比例<select id="ratio"><option value="full">窗口</option><option value="portrait">393 × 852</option><option value="wide">超宽</option></select></label>
    <output id="metrics"></output>
  </aside>
  <script type="module">
    import '/src/style.css';
    import '/src/music.css';
    import '/src/music-boot.css';
    import {MusicOpening,musicOpeningFrame} from '/src/music-opening.ts';
    const parent=document.querySelector('#stage'), output=document.querySelector('#metrics');
    const opening=new MusicOpening(parent);
    let loop=0,start=0,current=4.4;
    function show(time){
      current=time;opening.update(time);
      const title=parent.querySelector('[data-opening=title]');
      const rect=title.getBoundingClientRect();
      output.textContent=`${time.toFixed(2)}s · ${musicOpeningFrame(time).phase} · 标语 ${title.textContent} · ${Math.round(rect.width)} px`;
    }
    for(const button of document.querySelectorAll('[data-time]'))button.addEventListener('click',()=>{cancelAnimationFrame(loop);show(Number(button.dataset.time));});
    document.querySelector('#play').addEventListener('click',()=>{cancelAnimationFrame(loop);start=performance.now();function frame(now){show(Math.min(6.82,(now-start)/1000));if(current<6.82)loop=requestAnimationFrame(frame);}loop=requestAnimationFrame(frame);});
    document.querySelector('#theme').addEventListener('change',event=>{parent.dataset.theme=event.target.value;});
    document.querySelector('#ratio').addEventListener('change',event=>{
      parent.style.cssText=event.target.value==='portrait'?'width:393px;height:852px;max-width:100vw;max-height:100vh;left:50%;transform:translateX(-50%);':event.target.value==='wide'?'height:42vw;max-height:100vh;':'';
      parent.classList.toggle('boot-review-portrait',event.target.value==='portrait');
      show(current);
    });
    show(current);
  </script>
  <style>.boot-review-portrait .music-opening-statement p{font-size:23px;letter-spacing:.015em}.boot-review-portrait .music-opening-orbit{width:86%}.boot-review-portrait .music-opening-brand{left:20px;top:29px}</style>
</body>
</html>
