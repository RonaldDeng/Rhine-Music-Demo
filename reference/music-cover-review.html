<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>专辑封面渲染验证</title>
<style>body{margin:0;background:#eae5e1;font:14px system-ui}#scene{width:100vw;height:100vh}nav{position:fixed;left:20px;top:20px;z-index:2;background:#f4f2e8;padding:12px;border-radius:8px}button{padding:8px;margin:3px}output{display:block;padding:8px}#result{position:fixed;bottom:15px;left:20px;z-index:2;color:#667;font:12px monospace;background:#ffffffd9;padding:10px}</style>
<div id="scene"></div><nav><strong>独立验证页 · 仅使用测试封面</strong><br><button id="prev">上一专辑</button><button id="next">下一专辑</button><button id="open">打开专辑</button><button id="close">归位</button><button id="day">白天</button><button id="night">深夜</button><button id="dusk">薄暮</button><output id="title"></output></nav><div id="result"></div>
<script type="module">
import { ArchiveScene } from '/src/scene.ts';
import { setMusicAlbums, records } from '/src/data.ts';
const specifications = [[700,700,'#567777','方形 1:1'],[420,700,'#d99751','竖幅 3:5'],[1000,420,'#9c7899','横幅 50:21']];
const albums = specifications.map(([w,h,color,title],i)=>({id:`fixture-${i}`,title,artist:'封面比例测试',genreId:'test',rawGenres:[],folder:'',tracks:[],producers:[],offline:false,coverUrl:'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}"><rect width="100%" height="100%" fill="${color}"/><rect x="12" y="12" width="${w-24}" height="${h-24}" fill="none" stroke="white" stroke-width="12"/><circle cx="${w/2}" cy="${h/2}" r="${Math.min(w,h)*.25}" fill="none" stroke="white" stroke-width="12"/><text x="50%" y="88%" text-anchor="middle" fill="white" font-size="32">${title}</text><text x="5%" y="12%" fill="white" font-size="30">TL</text><text x="94%" y="12%" text-anchor="end" fill="white" font-size="30">TR</text><text x="5%" y="95%" fill="white" font-size="30">BL</text><text x="94%" y="95%" text-anchor="end" fill="white" font-size="30">BR</text></svg>`)}));
setMusicAlbums(albums,[{id:'test',name:'比例测试'}]);
const scene = new ArchiveScene(document.querySelector('#scene'));
await scene.load();scene.setMode('archive');scene.resize();
let index=0;const title=document.querySelector('#title');
function select(direction){index=(index+direction+records.length)%records.length;scene.select(index,{axis:'row',direction});title.textContent=records[index].title;}
document.querySelector('#prev').onclick=()=>select(-1);document.querySelector('#next').onclick=()=>select(1);
document.querySelector('#open').onclick=()=>scene.setMode('detail');document.querySelector('#close').onclick=()=>scene.setMode('archive');
for(const theme of ['day','night','dusk'])document.querySelector(`#${theme}`).onclick=()=>scene.setTheme(theme);
scene.onSelect=(i,cell)=>{index=i;scene.select(i,{cell});title.textContent=records[index].title;};
title.textContent=records[0].title;addEventListener('resize',()=>scene.resize());
let last=0,frames=0,total=0;function update(t){scene.update(t/1000);if(last){total+=t-last;frames++;}last=t;if(frames===60){document.querySelector('#result').textContent=JSON.stringify({...scene.getStats(),averageFrameMs:total/frames});frames=total=0;}requestAnimationFrame(update);}requestAnimationFrame(update);
</script></html>
